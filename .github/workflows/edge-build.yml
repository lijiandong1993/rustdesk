name: Edge Build (Windows Desktop)

on:
  push:
    branches: [edge-managed]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/**'
      - '.github/workflows/edge-build.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (Desktop)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup vcpkg (official pin)
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
          doNotCache: false

      - name: Install vcpkg dependencies (manifest)
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
        shell: bash

      - name: Build (release)
        run: cargo build --release -p rustdesk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-edge-windows-x64
          path: target/release/rustdesk.exe
          if-no-files-found: error
