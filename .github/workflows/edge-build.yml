name: Edge Build (Windows Desktop)

on:
  push:
    branches: [edge-managed]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'libs/**'
      - '.github/workflows/edge-build.yml'
  workflow_dispatch:

jobs:
  windows:
    name: Windows x64 (Desktop)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup vcpkg deps (libvpx/opus)
        uses: johnwason/vcpkg-action@v1
        with:
          pkgs: libvpx opus
          triplet: x64-windows-static-md

      - name: Build (release)
        run: cargo build --release -p rustdesk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-edge-windows-x64
          path: target/release/rustdesk.exe
          if-no-files-found: error
