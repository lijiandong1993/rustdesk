name: Build All Platforms

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxfixes-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libglib2.0-dev \
            libgtk-3-dev libasound2-dev libpulse-dev libva-dev \
            libvdpau-dev libclang-dev nasm libgstreamer1.0-dev

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: johnwason/vcpkg-action@v1
        with:
          pkgs: libvpx opus
          triplet: x64-windows-static-md

      - name: Build
        run: cargo build --release -p rustdesk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-desktop-${{ matrix.os }}
          path: |
            target/release/rustdesk
            target/release/rustdesk.exe

  android:
    name: Android (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable

      - name: Setup Rust targets for Android
        run: |
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build APK
        working-directory: flutter
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-android
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
